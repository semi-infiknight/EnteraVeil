# Build production images on every push to main and publish to ghcr.io.
#
# Public repo => unlimited free Actions minutes + unlimited free GHCR
# storage (per GitHub's 2024 pricing). Cost: $0/mo.
#
# Manual trigger also available via the Actions tab (workflow_dispatch).
#
# Droplet deploys by pulling these images:
#   ghcr.io/semi-infiknight/enteraveil-medusa:latest
#   ghcr.io/semi-infiknight/enteraveil-storefront:latest
#   ghcr.io/semi-infiknight/enteraveil-strapi:latest
#
# Railway deploy: docs/DEPLOY.md. GHCR images optional for self-hosted pulls.

name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: medusa,     dockerfile: apps/medusa/Dockerfile }
          - { name: storefront, dockerfile: apps/storefront/Dockerfile }
          - { name: strapi,     dockerfile: apps/strapi/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: ln
        run: echo "image_path=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/enteraveil-${{ matrix.app.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.app.name }}
        env:
          # Plain progress so failed RUN steps print their stderr to
          # the GHA log instead of being collapsed behind a wrapper.
          BUILDX_PROGRESS: plain
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: |
            ${{ steps.ln.outputs.image_path }}:latest
            ${{ steps.ln.outputs.image_path }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,scope=${{ matrix.app.name }},mode=max
          provenance: false
          # The action also has its own `progress:` option.
          # Set to plain so each RUN line is visible in the log.

      - name: Print pulled-by command
        run: |
          echo "On droplet, pull this image:"
          echo "  docker pull ${{ steps.ln.outputs.image_path }}:latest"
