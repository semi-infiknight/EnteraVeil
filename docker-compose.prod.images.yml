# Production compose for image-based deploys.
#
# Use this on the $6/mo droplet — it references pre-built images by name
# instead of `build:` blocks, so the droplet never runs `pnpm install`
# (which would OOM on 1 GB). Build the images on your laptop with
# `docker compose -f docker-compose.prod.yml build`, save them with
# `docker save`, scp the tarball to the droplet, then `docker load`.
#
# Full instructions: docs/DEPLOY-CHEAPEST.md, "Build pipeline — Option A".

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_DB},strapi
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Trim memory: 10 visitors/day doesn't need a fat shared_buffers
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
      - -c
      - work_mem=2MB

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    # Cap Redis memory — Medusa uses it as event bus + cache, not session store
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  medusa:
    image: ghcr.io/semi-infiknight/enteraveil-medusa:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STORE_CORS: https://${BRAND_DOMAIN}
      ADMIN_CORS: https://api.${BRAND_DOMAIN}
      AUTH_CORS: https://${BRAND_DOMAIN},https://api.${BRAND_DOMAIN}
      MEDUSA_BACKEND_URL: https://api.${BRAND_DOMAIN}
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384

  storefront:
    image: ghcr.io/semi-infiknight/enteraveil-storefront:latest
    restart: always
    depends_on:
      - medusa
    env_file: .env.prod
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.${BRAND_DOMAIN}
      NEXT_PUBLIC_STRAPI_URL: https://cms.${BRAND_DOMAIN}
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384

  strapi:
    image: ghcr.io/semi-infiknight/enteraveil-strapi:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/strapi
      STOREFRONT_REVALIDATION_URL: https://${BRAND_DOMAIN}/api/strapi-revalidate
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=320
    volumes:
      - strapi-uploads:/app/public/uploads

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      BRAND_DOMAIN: ${BRAND_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - medusa
      - storefront
      - strapi

volumes:
  postgres-data:
  redis-data:
  strapi-uploads:
  caddy-data:
  caddy-config:
