services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      # Multiple databases via init script — see ./scripts/postgres-init.sh
      POSTGRES_DB: medusa-store
      POSTGRES_MULTIPLE_DATABASES: medusa-store,strapi
    ports: ["5432:5432"]
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
      - "./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro"
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:
